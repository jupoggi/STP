<!-- Manifesto -->
<section id="manifesto" style="background: #FFFFFF">
<div style="max-width: 1360px; margin: 0 auto; padding: 96px 0; display: flex; flex-wrap: wrap; gap: 48px">
<div style="flex: 1 1 380px; display: flex; flex-direction: column; gap: 18px">
<p style="margin: 0; padding-left: var(--g); font-weight: 700; font-size: 15px; letter-spacing: 0.18em; color: #E50000">MANIFESTO</p>
<h2 style="margin: 0; font-weight: 700; font-size: clamp(44px, 4.6vw, 68px); line-height: 0.94; text-transform: uppercase; display: flex; flex-direction: column; gap: 0.08em">
<span class="stp-tabbed" style="color: #E50000"><i class="stp-tab" style="background: #E50000"></i>Sócios que<br>querem mudar</span>
<span class="stp-tabbed" style="color: #111111"><i class="stp-tab" style="background: #111111"></i>o jeito de<br>administrar<br>o São Paulo</span>
</h2>
<p style="margin: 10px 0 0; padding-left: var(--g); font-size: 24px; line-height: 1.3; color: #333333">“Com o primeiro verso de nosso hino saudamos a todos os sócios do São Paulo Futebol Clube, e pedimos um momento de sua atenção para que possamos compartilhar nossos propósitos.”</p>
</div>
<div style="flex: 999 1 560px; min-width: 0; padding: 0 var(--g) 0 24px; display: flex; flex-direction: column; gap: 18px; font-size: 20px; line-height: 1.5; color: #333333">
<p style="margin: 0">O movimento <strong style="font-weight: 700; color: #E50000">SALVE O TRICOLOR PAULISTA</strong> é composto por sócios que efetivamente buscam mudanças na maneira de administrar a Instituição, visando a democratização, a responsabilidade financeira e a transparência nos atos de gestão.</p>
<p style="margin: 0">Somos favoráveis à eleição direta do Presidente pela Assembleia Geral, com o voto de todos os sócios que possuam dois anos ou mais de matrícula associativa ininterrupta, e cumpram com os requisitos do Estatuto. Defendemos a escolha de Diretores Adjuntos e Assessores dos departamentos pelos praticantes das atividades, entre seus participantes que não sejam Conselheiros. Entendemos que as instalações do clube social devem ser utilizadas prioritariamente para atividades recreativas e educacionais dos sócios, sem caráter competitivo de alto rendimento.</p>
<p style="margin: 0">Na administração financeira nossa proposta é que as despesas não possam exceder as receitas recorrentes na apresentação do Orçamento Anual, e que as receitas de negociação de direitos de atletas sejam utilizadas prioritariamente para reduzir a dívida da Instituição. O Orçamento deve ser realista, e publicado quando de sua aprovação para conhecimento de todos. O Clube deve apresentar ao público em geral balancetes trimestrais, com acompanhamento do resultado em comparação com o orçado.</p>
<p style="margin: 0">Queremos o cumprimento do Estatuto quanto à profissionalização efetiva das Diretorias Executivas, todas, sem exceção, a serem ocupadas por profissionais com notório conhecimento em suas respectivas áreas de atuação. Desejamos o fim da caixa preta no futebol profissional, com o encaminhamento de todos os contratos para apreciação pelo Conselho de Administração, conforme estabelecido no Estatuto Social do SPFC. Propomos alterações na composição do Conselho de Administração, para que este se torne um órgão de fato independente.</p>
<p style="margin: 8px 0 0; padding: 24px 26px 20px; background: #E50000; color: #FFFFFF; font-weight: 700; font-size: 30px; line-height: 1.05; text-transform: uppercase">Queremos um SPFC preparado para os desafios do futuro, democrático, bem administrado e transparente.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-weight: 700; font-size: 15px; letter-spacing: 0.18em; color: #E50000">O QUE DEFENDEMOS</p>
<h2 style="margin: 0; font-weight: 700; font-size: clamp(44px, 4.6vw, 68px); line-height: 0.94; text-transform: uppercase; color: #111111"><span style="color: #E50000">Nossos</span> pilares</h2>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px">
<article style="display: flex; flex-direction: column; gap: 14px; border-top: 3px solid #111111; padding-top: 18px">
<span style="font-weight: 700; font-size: 72px; line-height: 0.85; color: #E50000">01</span>
<h3 style="margin: 0; font-weight: 700; font-size: 32px; line-height: 1; text-transform: uppercase">Democratização</h3>
<p style="margin: 0; font-size: 19px; line-height: 1.45; color: #333333">Entre os grandes clubes de futebol com modelo associativo no Brasil, o SPFC é um dos últimos a ainda manter o voto indireto para presidente. Defendemos o voto direto pela Assembleia Geral e a participação dos praticantes de cada atividade na escolha dos diretores adjuntos e assessores do clube social.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 14px; border-top: 3px solid #111111; padding-top: 18px">
<span style="font-weight: 700; font-size: 72px; line-height: 0.85; color: #E50000">02</span>
<h3 style="margin: 0; font-weight: 700; font-size: 32px; line-height: 1; text-transform: uppercase">Transparência</h3>
<p style="margin: 0; font-size: 19px; line-height: 1.45; color: #333333">Entra gestão, sai gestão, a promessa de transparência está sempre em evidência, mas sempre fica pela metade. Propomos a publicação anual do orçamento, a divulgação trimestral de balancetes e o fim da caixa preta no futebol profissional, com a apreciação de todos os contratos pelo Conselho de Administração, conforme estabelecido no Estatuto Social do clube.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 14px; border-top: 3px solid #111111; padding-top: 18px">
<span style="font-weight: 700; font-size: 72px; line-height: 0.85; color: #E50000">03</span>
<h3 style="margin: 0; font-weight: 700; font-size: 32px; line-height: 1; text-transform: uppercase">Responsabilidade financeira</h3>
<p style="margin: 0; font-size: 19px; line-height: 1.45; color: #333333">Quantos valores diferentes você já viu por aí sobre a dívida do clube? Quantas vezes já negociamos atletas e ela parece nunca ser efetivamente reduzida? Parece básico, mas nossa proposta é que as despesas não possam exceder as receitas recorrentes na apresentação do Orçamento — que deve ser realista — e que as receitas de negociação de direitos de atletas sejam usadas prioritariamente para reduzir a dívida da Instituição.</p>
</article>
</div>
</div>
</section>

<!-- Lideranças -->

</div>
<div style="padding: 0 var(--g); display: flex; flex-direction: column; gap: 28px">

</div>
<div style="flex: 999 1 420px; min-width: 0; padding: 24px 28px; display: flex; flex-direction: column; gap: 10px; justify-content: center">
<span style="font-weight: 700; font-size: 12px; letter-spacing: 0.16em; color: #E50000">CANDIDATO A PRESIDENTE · CHAPA SÃO PAULO DE VOLTA</span>
<h3 style="margin: 0; font-weight: 700; font-size: 30px; line-height: 1; text-transform: uppercase">Marcelo Portugal Gouvêa</h3>
<p style="margin: 0; font-size: 16px; line-height: 1.45; color: #333333">Advogado formado pela PUC-SP, com especializações pela FGV em estratégia processual e negociação. Conselheiro do São Paulo desde 2008 e vitalício desde 2014, integrou a comissão que investigou o contrato com a Far East, em 2015, e a que redigiu o novo Estatuto Social, em 2016. Liderança do Salve o Tricolor Paulista, fez oposição à gestão Casares e foi um dos autores do pedido de destituição. Fora do clube, foi diretor de handebol do EC Pinheiros e fundou a Abrahand e a Liga Jurídica de Escritórios de Advocacia, que presidiu. Filho do ex-presidente Marcelo Figueiredo Portugal Gouvêa (2002–2006), lidera a chapa São Paulo de Volta.</p>
</div>

function quebraOnde(s){
  s = String(s || "").replace(/!$/, "").trim();
  if (!s) return [];
  var JUNTOS = ["festas e eventos", "ginástica e dança", "cultura e lazer", "academia e bem-estar"];
  JUNTOS.forEach(function(j, k){ s = s.split(j).join("§" + k + "§"); });
  var partes = s.split(", ");
  var ult = partes.pop(); var i = ult.lastIndexOf(" e ");
  if (i > 0) { partes.push(ult.slice(0, i)); partes.push(ult.slice(i + 3)); } else { partes.push(ult); }
  return partes.map(function(p){
    p = p.trim().replace(/§(\d)§/g, function(_, k){ return JUNTOS[Number(k)]; });
    return p.charAt(0).toUpperCase() + p.slice(1);
  });
}

}
